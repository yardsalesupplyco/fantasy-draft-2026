<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Draft Kombat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%; overflow: hidden; background-color: #000; color: #fff;
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
        }
        .font-bebas { font-family: 'Bebas Neue', cursive; }

        header { flex-shrink: 0; }

        #stage {
            position: relative; width: 100%; max-width: 1400px; height: 620px;
            background-color: #1a1a1a; border: 8px solid #333; border-radius: 1rem;
            margin: auto; overflow: hidden; box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        .video-bg {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            width: auto; height: auto; object-fit: cover; transform: translate(-50%, -50%);
            z-index: 1; opacity: 0.7; filter: brightness(0.75); image-rendering: pixelated; 
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; box-sizing: border-box;
        }

        .player-hud { width: 40%; }
        .player-name {
            font-family: 'Bebas Neue', cursive; font-size: 2.5rem;
            text-transform: uppercase; text-shadow: 2px 2px 4px #000; margin-bottom: 5px;
        }
        .p2-hud .player-name { text-align: right; }

        .health-bar-container {
            width: 100%; height: 35px; background-color: #333; border: 3px solid #ddd;
            border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .health-bar {
            height: 100%; width: 100%; background: linear-gradient(to bottom, #ff3333, #aa0000);
            transition: width 0.15s ease-out;
        }
        .p2-hud .health-bar { float: right; }

        #vs-badge {
            font-family: 'Bebas Neue', cursive; font-size: 4rem; color: #FBBF24;
            text-shadow: 0 0 20px #ff0000, 2px 2px 0px #000; animation: pulse 1s infinite alternate;
        }

        #announcer-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-family: 'Bebas Neue', cursive; font-size: 8rem; color: #FBBF24;
            text-shadow: 6px 6px 0px #b91c1c, 0 0 40px rgba(0,0,0,0.8); z-index: 60; opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }
        .show-announce { transform: translate(-50%, -50%) scale(1) !important; opacity: 1 !important; }

        .fighter {
            position: absolute; bottom: 35px; width: 300px; display: flex;
            flex-direction: column; align-items: center; z-index: 20; transition: transform 0.1s ease-out;
        }

        #fighter-1 { left: 28%; }
        #fighter-2 { right: 28%; } 
        #fighter-2 .fighter-image { transform: scaleX(-1); } 

        .fighter-image {
            width: 100%; height: auto; max-height: 420px; object-fit: contain;
            filter: drop-shadow(0px 15px 12px rgba(0,0,0,0.8));
            transition: filter 0.1s, transform 0.1s;
            image-rendering: pixelated; 
        }

        .fighter-name-tag {
            display: inline-block; background-color: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 4px 12px; border-radius: 4px; font-weight: bold; margin-top: -15px; z-index: 21;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .anim-attack { transform: translateX(110px) !important; }
        .anim-attack-p2 { transform: translateX(-110px) !important; }
        .anim-hit { 
            filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(3) drop-shadow(0px 0px 20px red) !important;
            transform: translateX(-25px);
        }
        .anim-hit-p2 {
            filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(3) drop-shadow(0px 0px 20px red) !important;
            transform: translateX(25px);
        }
        
        .anim-ko {
            filter: grayscale(100%);
            animation: fadeOut 2.5s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .particle {
            position: absolute; font-size: 3rem; z-index: 40; pointer-events: none;
            animation: popOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popOut {
            0% { transform: scale(0.5) translate(0, 0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        #ticker-container { flex-shrink: 0; }
        #ticker {
            background-color: #111; border-top: 4px solid #FBBF24; overflow-x: auto;
            white-space: nowrap; padding: 10px;
        }
        .pick-card {
            display: inline-block; background-color: #222; border: 1px solid #444;
            border-radius: 0.5rem; padding: 0.5rem 1rem; margin: 0 0.5rem;
            min-width: 150px; text-align: center; animation: slideInRight 0.5s ease-out;
        }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        /* --- MOBILE RESPONSIVE OVERRIDES --- */
        @media (max-width: 768px) {
            #stage {
                height: 42vh;
                min-height: 260px;
                border-width: 4px;
                border-radius: 0.5rem;
            }

            #hud {
                padding: 6px 12px;
            }

            .player-name {
                font-size: 1rem;
                margin-bottom: 2px;
            }

            .health-bar-container {
                height: 14px;
                border-width: 1px;
            }

            #vs-badge {
                font-size: 1.5rem;
            }

            #announcer-text {
                font-size: 3.5rem;
            }

            .fighter {
                width: 120px;
                bottom: 10px;
            }

            #fighter-1 { left: 8%; }
            #fighter-2 { right: 8%; }

            .fighter-name-tag {
                font-size: 0.6rem;
                padding: 1px 4px;
                margin-top: -6px;
            }

            .anim-attack { transform: translateX(35px) !important; }
            .anim-attack-p2 { transform: translateX(-35px) !important; }
            .anim-hit { transform: translateX(-8px) !important; }
            .anim-hit-p2 { transform: translateX(8px) !important; }

            .particle {
                font-size: 1.5rem;
            }

            #startButton {
                font-size: 1.75rem;
                padding: 0.5rem 1.5rem;
            }

            header h1 {
                font-size: 1.75rem;
            }
            header p {
                font-size: 0.75rem;
            }

            #ticker {
                padding: 6px;
            }

            .pick-card {
                min-width: 100px;
                padding: 0.2rem 0.4rem;
                margin: 0 0.25rem;
            }
        }
    </style>
</head>
<body>

    <header class="text-center p-2">
        <h1 class="font-bebas text-5xl text-amber-400 tracking-wider">Fantasy Draft Kombat</h1>
        <p class="text-gray-400 text-sm">12 Teams. 11 Matches. 1 Champion.</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-2 min-h-0 overflow-hidden">
        <div id="controls" class="text-center mb-4 z-50 absolute">
            <button id="startButton" class="font-bebas bg-amber-400 text-gray-900 text-4xl px-12 py-4 rounded-lg shadow-[0_0_20px_rgba(251,191,36,0.6)] hover:bg-amber-300 hover:scale-105 transition-all">
                BEGIN TOURNAMENT
            </button>
        </div>
        <div id="stage">
             <img id="bg-image" class="video-bg" src="background.gif" alt="Fighting Stage">
             
             <div id="hud" class="hidden">
                 <div class="player-hud p1-hud">
                     <div class="player-name text-amber-400" id="p1-name">Player 1</div>
                     <div class="health-bar-container"><div class="health-bar" id="p1-health"></div></div>
                 </div>
                 <div id="vs-badge">VS</div>
                 <div class="player-hud p2-hud">
                     <div class="player-name text-amber-400" id="p2-name">Player 2</div>
                     <div class="health-bar-container"><div class="health-bar" id="p2-health"></div></div>
                 </div>
             </div>

             <div id="announcer-text">FIGHT!</div>

             <div id="fighters-container" class="hidden">
                 <div id="fighter-1" class="fighter">
                     <img id="p1-img" src="" class="fighter-image">
                     <span id="p1-tag" class="fighter-name-tag"></span>
                 </div>
                 <div id="fighter-2" class="fighter">
                     <img id="p2-img" src="" class="fighter-image">
                     <span id="p2-tag" class="fighter-name-tag"></span>
                 </div>
             </div>
        </div>
    </main>

    <footer id="ticker-container" class="w-full">
        <div id="ticker" class="w-full h-16 sm:h-20 flex items-center"></div>
    </footer>
    
    <!-- Audio Elements -->
    <audio id="bg-music" loop src="kenstagemusic.mp3"></audio>
    <audio id="ko-sound" src="crowd-ovation.mp3"></audio>
    <audio id="winner-announcement" src="WinnerIs.mp3"></audio>
    <audio id="trophy-sound" src="trophy-sound.mp3"></audio>

    <script>
        const TEAMS = [
            { id: 1, name: "Brianna's Sweaterdress", eliminationAudio: new Audio("BSgone.mp3"), imgIdle: "p1-idle.gif", imgPunchLeft: "p1-left-punch.gif", imgPunchRight: "p1-right-punch.gif", imgKick: "p1-kick.gif", imgHurt: "p1-hurt.gif", imgKO: "p1-dead.gif" },
            { id: 2, name: "Stucknut", eliminationAudio: new Audio("SNgone.mp3"), imgIdle: "p2-idle.gif", imgPunchLeft: "p2-left-punch.gif", imgPunchRight: "p2-right-punch.gif", imgKick: "p2-kick.gif", imgHurt: "p2-hurt.gif", imgKO: "p2-dead.gif" },
            { id: 3, name: "LaMario Kart", eliminationAudio: new Audio("LCout.mp3"), imgIdle: "p3-idle.gif", imgPunchLeft: "p3-left-punch.gif", imgPunchRight: "p3-right-punch.gif", imgKick: "p3-kick.gif", imgHurt: "p3-hurt.gif", imgKO: "p3-dead.gif" },
            { id: 4, name: "SparkleBrite Static", eliminationAudio: new Audio("SBSout.mp3"), imgIdle: "p4-idle.gif", imgPunchLeft: "p4-left-punch.gif", imgPunchRight: "p4-right-punch.gif", imgKick: "p4-kick.gif", imgHurt: "p4-hurt.gif", imgKO: "p4-dead.gif" },
            { id: 5, name: "Joelslaw", eliminationAudio: new Audio("JSseeya.mp3"), imgIdle: "p5-idle.gif", imgPunchLeft: "p5-left-punch.gif", imgPunchRight: "p5-right-punch.gif", imgKick: "p5-kick.gif", imgHurt: "p5-hurt.gif", imgKO: "p5-dead.gif" },
            { id: 6, name: "Brianna's Johnson", eliminationAudio: new Audio("BJseeya.mp3"), imgIdle: "p6-idle.gif", imgPunchLeft: "p6-left-punch.gif", imgPunchRight: "p6-right-punch.gif", imgKick: "p6-kick.gif", imgHurt: "p6-hurt.gif", imgKO: "p6-dead.gif" },
            { id: 7, name: "Warden Ward", eliminationAudio: new Audio("WWbuhbye.mp3"), imgIdle: "p7-idle.gif", imgPunchLeft: "p7-left-punch.gif", imgPunchRight: "p7-right-punch.gif", imgKick: "p7-kick.gif", imgHurt: "p7-hurt.gif", imgKO: "p7-dead.gif" },
            { id: 8, name: "Chattahoochee Coochie", eliminationAudio: new Audio("CCbuhbye.mp3"), imgIdle: "p8-idle.gif", imgPunchLeft: "p8-left-punch.gif", imgPunchRight: "p8-right-punch.gif", imgKick: "p8-kick.gif", imgHurt: "p8-hurt.gif", imgKO: "p8-dead.gif" },
            { id: 9, name: "Randy's Virgins", eliminationAudio: new Audio("RVnicetry.mp3"), imgIdle: "p9-idle.gif", imgPunchLeft: "p9-left-punch.gif", imgPunchRight: "p9-right-punch.gif", imgKick: "p9-kick.gif", imgHurt: "p9-hurt.gif", imgKO: "p9-dead.gif" },
            { id: 10, name: "Tuna Can Dan", eliminationAudio: new Audio("TCDsolongsucka.mp3"), imgIdle: "p10-idle.gif", imgPunchLeft: "p10-left-punch.gif", imgPunchRight: "p10-right-punch.gif", imgKick: "p10-kick.gif", imgHurt: "p10-hurt.gif", imgKO: "p10-dead.gif" },
            { id: 11, name: "Fairdealing's Finest", eliminationAudio: new Audio("FFsolongsucka.mp3"), imgIdle: "p11-idle.gif", imgPunchLeft: "p11-left-punch.gif", imgPunchRight: "p11-right-punch.gif", imgKick: "p11-kick.gif", imgHurt: "p11-hurt.gif", imgKO: "p11-dead.gif" },
            { id: 12, name: "Crisco Cops", eliminationAudio: new Audio("CCnicetry.mp3"), imgIdle: "p12-idle.gif", imgPunchLeft: "p12-left-punch.gif", imgPunchRight: "p12-right-punch.gif", imgKick: "p12-kick.gif", imgHurt: "p12-hurt.gif", imgKO: "p12-dead.gif" },
        ];

        const punchAudios = [
            new Audio("punch1.mp3"),
            new Audio("punch2.mp3"),
            new Audio("punch3.mp3"),
            new Audio("punch4.mp3"),
            new Audio("punch5.mp3")
        ];

        function preloadImages() {
            TEAMS.forEach(team => {
                new Image().src = team.imgIdle;
                new Image().src = team.imgPunchLeft;
                new Image().src = team.imgPunchRight;
                new Image().src = team.imgKick;
                new Image().src = team.imgHurt;
                new Image().src = team.imgKO;
            });
        }
        preloadImages();

        const startBtn = document.getElementById('startButton');
        const bgMusic = document.getElementById('bg-music');
        const koSound = document.getElementById('ko-sound');
        const winnerAnnounce = document.getElementById('winner-announcement');
        const trophySound = document.getElementById('trophy-sound');
        const hud = document.getElementById('hud');
        const fightersContainer = document.getElementById('fighters-container');
        const announcer = document.getElementById('announcer-text');
        
        const f1 = document.getElementById('fighter-1');
        const f2 = document.getElementById('fighter-2');
        const p1Img = document.getElementById('p1-img');
        const p2Img = document.getElementById('p2-img');
        const p1HealthBar = document.getElementById('p1-health');
        const p2HealthBar = document.getElementById('p2-health');
        const ticker = document.getElementById('ticker');

        bgMusic.volume = 0.3; koSound.volume = 0.7;

        let bracketQueue = []; let nextRoundQueue = []; let byes = [];
        let currentPickNumber = 12; let currentMatch = null;

        function generateBracket() {
            let shuffled = [...TEAMS].sort(() => Math.random() - 0.5);
            byes = shuffled.slice(0, 4);
            const r1Fighters = shuffled.slice(4, 12);
            bracketQueue = [];
            for (let i = 0; i < r1Fighters.length; i += 2) {
                bracketQueue.push({ p1: r1Fighters[i], p2: r1Fighters[i+1], round: "ROUND 1" });
            }
            nextRoundQueue = [];
        }

        // SILENT AUDIO PRIMING FOR MOBILE
        startBtn.addEventListener('click', () => {
            startBtn.parentElement.classList.add('hidden');
            
            const allAudios = [
                bgMusic, koSound, winnerAnnounce, trophySound,
                ...punchAudios,
                ...TEAMS.map(t => t.eliminationAudio)
            ];

            allAudios.forEach(audio => {
                if (audio) {
                    audio.muted = true; // Mute while unlocking
                    audio.play().then(() => {
                        if (audio !== bgMusic) {
                            audio.pause();
                            audio.currentTime = 0;
                            audio.muted = false; // Restore sound for later playback
                        } else {
                            audio.muted = false;
                        }
                    }).catch(e => {});
                }
            });

            generateBracket(); nextMatch();
        });

        function nextMatch() {
            if (bracketQueue.length === 0) {
                if (nextRoundQueue.length === 1 && byes.length === 0) { declareChampion(nextRoundQueue[0]); return; }
                bracketQueue = [];
                
                if (byes.length > 0) {
                    for (let i = 0; i < 4; i++) {
                        bracketQueue.push({ p1: byes[i], p2: nextRoundQueue[i], round: "QUARTERFINALS" });
                    }
                    byes = []; 
                    nextRoundQueue = [];
                } else {
                    let roundName = nextRoundQueue.length === 4 ? "SEMIFINALS" : "CHAMPIONSHIP";
                    for (let i = 0; i < nextRoundQueue.length; i += 2) {
                        bracketQueue.push({ p1: nextRoundQueue[i], p2: nextRoundQueue[i+1], round: roundName });
                    }
                    nextRoundQueue = [];
                }
            }
            currentMatch = bracketQueue.shift(); setupFight(currentMatch);
        }

        function flashAnnouncer(text, duration, callback) {
            announcer.textContent = text; announcer.classList.add('show-announce');
            setTimeout(() => {
                announcer.classList.remove('show-announce');
                if (callback) setTimeout(callback, 300); 
            }, duration);
        }

        function setupFight(match) {
            f1.className = 'fighter'; f2.className = 'fighter';
            p1HealthBar.style.width = '100%'; p2HealthBar.style.width = '100%';
            
            document.getElementById('p1-name').textContent = match.p1.name;
            document.getElementById('p2-name').textContent = match.p2.name;
            document.getElementById('p1-tag').textContent = match.p1.name;
            document.getElementById('p2-tag').textContent = match.p2.name;
            
            p1Img.src = match.p1.imgIdle; p2Img.src = match.p2.imgIdle;
            
            p1Img.onerror = function() { this.src = 'https://placehold.co/150x200?text=Fighter'; };
            p2Img.onerror = function() { this.src = 'https://placehold.co/150x200?text=Fighter'; };

            hud.classList.remove('hidden'); fightersContainer.classList.remove('hidden');

            flashAnnouncer(match.round, 2000, () => {
                flashAnnouncer("FIGHT!", 1000, () => { startCombat(match.p1, match.p2); });
            });
        }

        function startCombat(p1Data, p2Data) {
            let p1Hp = 100; let p2Hp = 100;
            let currentAttacker = Math.random() > 0.5 ? 1 : 2;
            let comboCount = 0;
            let targetCombo = Math.floor(Math.random() * 3) + 1; 

            function strikeLoop() {
                if (p1Hp <= 0 || p2Hp <= 0) return; 

                let defenderHp = currentAttacker === 1 ? p2Hp : p1Hp;
                if (defenderHp > 0 && defenderHp <= 30 && Math.random() < 0.45) {
                    currentAttacker = currentAttacker === 1 ? 2 : 1; 
                    comboCount = 0;
                    targetCombo = Math.floor(Math.random() * 4) + 2; 
                }

                let damage = Math.floor(Math.random() * 9) + 8; 
                let delayToNextStrike = comboCount > 0 ? (Math.floor(Math.random() * 200) + 400) : (Math.floor(Math.random() * 500) + 700);

                if (currentAttacker === 1) {
                    p2Hp -= damage; if(p2Hp < 0) p2Hp = 0;
                    p2HealthBar.style.width = `${p2Hp}%`; animateStrike(1);
                } else {
                    p1Hp -= damage; if(p1Hp < 0) p1Hp = 0;
                    p1HealthBar.style.width = `${p1Hp}%`; animateStrike(2);
                }

                comboCount++;
                if (comboCount >= targetCombo) {
                    currentAttacker = currentAttacker === 1 ? 2 : 1;
                    comboCount = 0;
                    targetCombo = Math.floor(Math.random() * 3) + 1; 
                }

                if (p1Hp <= 0 || p2Hp <= 0) {
                    setTimeout(() => {
                        handleKnockout(p1Hp <= 0 ? p1Data : p2Data, p1Hp <= 0 ? p2Data : p1Data, p1Hp <= 0 ? 1 : 2);
                    }, 400); 
                } else {
                    setTimeout(strikeLoop, delayToNextStrike);
                }
            }
            
            setTimeout(strikeLoop, 1000);
        }

        function animateStrike(attackerNum) {
            const attacker = attackerNum === 1 ? f1 : f2;
            const defender = attackerNum === 1 ? f2 : f1;
            const attackerImg = attackerNum === 1 ? p1Img : p2Img;
            const defenderImg = attackerNum === 1 ? p2Img : p1Img;
            
            const attackerData = attackerNum === 1 ? currentMatch.p1 : currentMatch.p2;
            const defenderData = attackerNum === 1 ? currentMatch.p2 : currentMatch.p1;

            const attackClass = attackerNum === 1 ? 'anim-attack' : 'anim-attack-p2';
            const hitClass = attackerNum === 1 ? 'anim-hit-p2' : 'anim-hit'; 

            const attackRoll = Math.random();
            if (attackRoll < 0.33) {
                attackerImg.src = attackerData.imgPunchLeft;
            } else if (attackRoll < 0.66) {
                attackerImg.src = attackerData.imgPunchRight;
            } else {
                attackerImg.src = attackerData.imgKick;
            }
            
            attacker.classList.add(attackClass);
            
            setTimeout(() => {
                let randomPunch = punchAudios[Math.floor(Math.random() * punchAudios.length)];
                randomPunch.currentTime = 0;
                randomPunch.volume = 0.9;
                randomPunch.play().catch(e=>{});
                
                defenderImg.src = defenderData.imgHurt;
                defender.classList.add(hitClass);
                spawnImpact(attackerNum);

                setTimeout(() => {
                    attackerImg.src = attackerData.imgIdle;
                    defenderImg.src = defenderData.imgIdle;
                    attacker.classList.remove(attackClass);
                    defender.classList.remove(hitClass);
                }, 250); 
            }, 100); 
        }

        function spawnImpact(attackerNum) {
            const emojis = ['💥', '🗯️', '💢'];
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            particle.style.left = '50%'; particle.style.top = '40%';
            const direction = attackerNum === 1 ? 1 : -1;
            particle.style.setProperty('--tx', `${direction * (50 + Math.random() * 100)}px`);
            particle.style.setProperty('--ty', `-${50 + Math.random() * 50}px`);
            
            document.getElementById('stage').appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }

        function handleKnockout(loser, winner, loserNum) {
            const loserImg = loserNum === 1 ? p1Img : p2Img;
            const loserData = loserNum === 1 ? currentMatch.p1 : currentMatch.p2;
            
            loserImg.src = loserData.imgKO;

            flashAnnouncer("K.O.", 2500, () => {
                if (loser.eliminationAudio) {
                    loser.eliminationAudio.currentTime = 0;
                    loser.eliminationAudio.volume = 0.9;
                    loser.eliminationAudio.play().catch(e=>{});
                }
                nextRoundQueue.push(winner); assignPick(loser);
                hud.classList.add('hidden'); fightersContainer.classList.add('hidden');
                setTimeout(nextMatch, 1500);
            });

            const loserEl = loserNum === 1 ? f1 : f2;
            loserEl.classList.add('anim-ko');
            koSound.currentTime = 0; koSound.play().catch(e=>{});
        }

        function assignPick(team) {
            const pickCard = document.createElement('div'); pickCard.className = 'pick-card';
            pickCard.innerHTML = `<div class="font-bebas text-xl sm:text-2xl text-amber-400">PICK ${currentPickNumber}</div><div class="font-bold text-xs sm:text-sm truncate">${team.name}</div>`;
            ticker.insertBefore(pickCard, ticker.firstChild); currentPickNumber--;
        }

        function declareChampion(winner) {
            assignPick(winner); 
            winnerAnnounce.currentTime = 0; winnerAnnounce.play().catch(e=>{});
            trophySound.currentTime = 0; trophySound.play().catch(e=>{});
